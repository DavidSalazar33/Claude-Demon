# Self-hosting with Docker.
#
#   docker compose up -d --build
#   # then seed once (loads mock data):
#   docker compose exec app npx tsx prisma/seed.ts
#
# Default storage is a SQLite file on a named volume (zero extra services).
# To use Postgres instead: uncomment the `db` service, switch the datasource
# provider in prisma/schema.prisma to "postgresql", and point DATABASE_URL at it.

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/data/prod.db"
      FINANCIAL_PROVIDER: "mock"
      # When using Plaid:
      # FINANCIAL_PROVIDER: "plaid"
      # PLAID_CLIENT_ID: "${PLAID_CLIENT_ID}"
      # PLAID_SECRET: "${PLAID_SECRET}"
      # PLAID_ENV: "sandbox"
    volumes:
      - money_data:/data
    restart: unless-stopped
    # depends_on:
    #   - db

  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: money
  #     POSTGRES_PASSWORD: changeme
  #     POSTGRES_DB: money_tracker
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  money_data:
